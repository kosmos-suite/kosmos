services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kosmos
      POSTGRES_USER: kosmos
      POSTGRES_PASSWORD: kosmos
    volumes:
      - kosmos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmos -d kosmos"]
      interval: 5s
      timeout: 5s
      retries: 10

  kosmos:
    build:
      context: .
      dockerfile: src/main/docker/${KOSMOS_DOCKERFILE:-Dockerfile.jvm}
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/kosmos
      QUARKUS_DATASOURCE_USERNAME: kosmos
      QUARKUS_DATASOURCE_PASSWORD: kosmos
      KOSMOS_METADATA_TMDB_API_KEY: ${KOSMOS_METADATA_TMDB_API_KEY:-}
      KOSMOS_LIBRARY_ROOT_PATH: /library
    volumes:
      - kosmos-library:/library
    ports:
      - "8080:8080"

volumes:
  kosmos-db:
  kosmos-library:
