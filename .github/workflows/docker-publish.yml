name: docker-publish

# Manual only for now — trigger from the Actions tab, or `gh workflow run docker-publish.yml`
# (add --ref <tag> to build a specific version) once a release is actually ready to ship, rather
# than publishing an image on every push to main.
on:
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          # linux/amd64 only for now — matches the common VPS/Dokploy deploy target. Cross-building
          # linux/arm64 here would run under QEMU emulation, and the Gradle+Node build this Dockerfile
          # does is heavy enough that emulation would make CI painfully slow; revisit if arm64 hosts
          # (e.g. NAS deploys) turn out to matter.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
